title: QA Handbook
description: ISTQB Foundation, клієнт-серверна архітектура та API testing за рівнями Junior / Middle / Senior
theme: jekyll-theme-minimal
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: false
optional_front_matter:
  enabled: true
  remove_originals: true
readme_index:
  enabled: true
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collections: true
